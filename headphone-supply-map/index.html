const farK = d => ss(seg(d, 500, 1300));          // far labels (seas) fade in as the camera climbs, near labels fade out

function seaNames(t, d) {
  const a = farK(d) * ss(seg(t, 5.5, 6.5)) * (1 - ss(seg(t, 25.4, 26.2))) + farK(d) * ss(seg(t, 30.6, 31.8));
  for (const [s, ll] of [['EAST CHINA SEA', [125.6, 29.6]], ['SOUTH CHINA SEA', [113.2, 17.0]], ['YELLOW SEA', [123.4, 37.2]], ['PACIFIC OCEAN', [128.0, 21.0]]]) {
    const [x, y, z] = scr(sea(...ll, 0)); if (z > 1 || x < 0 || x > Wd) continue; txt(s, x, y, { size: 24, sp: 7, col: C.sea, a: .78 * Math.min(1, a) , al: 'c', pass: true });
  }
}
function hubLabel(t, d) {
  const [x, y, z] = scr(HUBP); if (z > 1) return;
  const near = 1 - ss(seg(d, 700, 1300)), open = ss(seg(t, .8, 1.6)) * (1 - ss(seg(t, 4.2, 5.0)));
  // opening: ring pulse, leader out to the title set in empty sky
  if (open > 0) {
    const r = 10 + 38 * ((t * .9) % 1); g.save(); g.globalAlpha = .5 * open * (1 - ((t * .9) % 1)); g.strokeStyle = '#ffc36b'; g.lineWidth = 1.6 * U; g.beginPath(); g.arc(x, y, r * U, 0, 7); g.stroke(); g.restore();
    dot(x, y, 4.2, '#ffc36b', open);
    const lx = x - 40 * U, ly = y - 150 * U; line([[x, y - 8 * U], [lx, ly + 10 * U]], 'rgba(246,238,224,.75)', 1.3, open * ss(seg(t, 1.0, 1.7)));
    const k = ss(seg(t, 1.3, 2.2)); txt('WHERE A HEADPHONE', lx, ly - 52 * U, { size: 50, w: 600, sp: 10, col: C.light, a: k * open });
    txt('COMES FROM', lx, ly, { size: 50, w: 600, sp: 10, col: C.light, a: k * open });
    txt('A TYPICAL SUPPLY CHAIN · ROUTES AND POSITIONS SCHEMATIC', lx, ly + 38 * U, { size: 20, sp: 5, col: C.sea, a: .85 * k * open });
  }
  // hub name, once it matters
  const on = ss(seg(t, 21.8, 22.6)) * (1 - ss(seg(t, 25.0, 25.8))) + ss(seg(t, 26.0, 26.7)) * (1 - ss(seg(t, 30.6, 31.4)));
  if (on > 0) { dot(x, y, 5, '#ffc36b', on); txt('SHENZHEN', x + 18 * U, y + 7 * U, { size: 30, w: 600, sp: 7, col: C.sea, a: on * near }); }
  if (on > 0 && t > 26.2 && t < 30.6) txt('ELECTRONICS CLUSTERS', x + 18 * U, y + 38 * U, { size: 20, sp: 5, col: C.sea, a: .85 * ss(seg(t, 26.6, 27.4)) * (1 - ss(seg(t, 30.0, 30.6))) });
  // final: the hub as a lit point among the three pillars
  const fin = ss(seg(t, 31.8, 32.6)); if (fin > 0) dot(x, y, 4.4, '#ffc36b', fin);
}
function pillarLabels(t, d) {
  for (const k of ['mag', 'li', 'chip']) {
    const s = SITES[k]; const a = ss(seg(t, s.t0 - .3, s.t0 + .6));
    // each label shows while its line is spoken, and stays (smaller) through the last shot
    const stay = ss(seg(t, 30.9, 31.8)), main = a * (1 - ss(seg(t, s.t1 + 3.2, s.t1 + 4.2)));
    const alpha = Math.max(main, stay * a);
    if (alpha <= 0) continue;
    const top = s.P.clone(); top.y += PSH * (s.n * Math.min(1, eo(seg(t, s.t0, s.t1)))) + 4;
    const [px, py, pz] = scr(top), [lx, ly] = scr(sea(...s.lab, 0));
    if (pz > 1) continue;
    const big = 1 - .38 * stay;
    line([[px, py], [lx - 12 * U, ly]], 'rgba(246,238,224,.7)', 1.3, alpha * .9);
    txt(s.num, lx, ly + 16 * U * big, { size: 80 * big, w: 600, col: C.light, a: alpha * ss(seg(t, s.t0 + .2, s.t0 + 1.0)), id: k + '-n' });
    const k2 = alpha * ss(seg(t, s.t0 + .5, s.t0 + 1.3));
    txt(s.l1, lx + 2 * U, ly + (16 + 32) * U * big, { size: 23 * big, w: 600, sp: 3.5, col: C.light, a: k2, id: k + '-1' });
    txt(s.l2, lx + 2 * U, ly + (16 + 32 + 25) * U * big, { size: 23 * big, w: 600, sp: 3.5, col: C.amber, a: k2, id: k + '-2' });
    txt(s.src, lx + 2 * U, ly + (16 + 32 + 25 + 23) * U * big, { size: 14 * big, sp: 2.5, col: C.sea, a: .85 * k2, id: k + '-s' });
  }
}
function laneLabels(t) {
  for (const L of LANES) {
    const a = ss(seg(t, L.t + 1.5, L.t + 2.3)) ; if (a <= 0) continue;
    const [x, y, z] = scr(sea(...L.lab, 0)); if (z > 1) continue;
    txt(L.text, x, y, { size: 24, w: 600, sp: 5, col: C.amber, a: a * .95, al: 'c' });
    txt('SCHEMATIC', x, y + 24 * U, { size: 15, sp: 4, col: C.sea, a: a * .8, al: 'c', pass: true });
  }
}
function subtitles(t) {
  const c = CUES.find(c => t >= c.t0 && t < c.t1); if (!c) return;
  const a = ss(seg(t, c.t0, c.t0 + .3)) * (1 - ss(seg(t, c.t1 - .3, c.t1)));
  const size = 38 * U, w = tw(c.text, size, 500, 1), x0 = 64 * U, y0 = Ht - 78 * U;
  const gr = g.createLinearGradient(0, Ht - 220 * U, 0, Ht); gr.addColorStop(0, 'rgba(5,8,12,0)'); gr.addColorStop(1, `rgba(5,8,12,${.62 * a})`);
  g.save(); g.fillStyle = gr; g.fillRect(0, Ht - 220 * U, Wd, 220 * U); g.restore();
  g.save(); g.globalAlpha = a; g.fillStyle = '#ffc36b'; g.fillRect(x0 - 22 * U, y0 - size * .95, 3 * U, size * 1.25); g.restore();
  txt(c.text, x0, y0, { size: 38, w: 500, sp: 1, col: C.light, a, id: c.id });
}
function credits(t) {
  const a = ss(seg(t, 0.5, 1.5)) * .72;
  txt('ELEVATION: AWS TERRAIN TILES · IMAGERY: SENTINEL-2 CLOUDLESS 2016 BY EOX (CC BY 4.0), NASA BLUE MARBLE · HEIGHTS ×3.2 · PILLAR HEIGHTS NOT TO SCALE · NO BORDERS DRAWN', Wd - 28 * U, 30 * U, { size: 15, sp: 2, col: C.ice, a, al: 'r', pass: true });
}

// ---------- the frame at film time t ----------
const EVF = [];
function frame(t) {
  TX = [];
  const d = setCamera(t);
  // pillars
  for (const k of ['mag', 'li', 'chip']) {
    const s = SITES[k], kk = eio(seg(t, s.t0, s.t1)); s.p.grp.visible = t >= s.t0 - .05; growPillar(s.p, kk);
    s.p.ghost.forEach((r, i) => { r.material.opacity = .0 + .5 * ss(seg(t, s.t0 - .1, s.t0 + .8)) * (i < 10 ? 1 : 0); });
    s.p.mat = s.p.mat;
    // pillars are scaled up with distance so they stay legible when the camera is far
    s.p.grp.scale.setScalar(1);
  }
  // arcs 22.0 / 22.35 / 22.7: each one draws from its pillar to the hub with a bright head
  ['mag', 'li', 'chip'].forEach((k, i) => {
    const s = SITES[k], t0 = 22.0 + i * .35, kv = eo(seg(t, t0, t0 + 1.9)), hold = 1 - .35 * ss(seg(t, 26, 28)), fade = 1 - ss(seg(t, 31.0, 32.0)) * .55;
    for (const r of [s.glow, s.core]) rv(r, { revB: kv * r.L, inten: (t >= t0 ? 1 : 0) * hold * fade, head: kv * r.L, headAmt: r === s.core ? 1.5 * (1 - ss(seg(kv, .85, 1))) : 0, soft: 24, flowPh: t * 44 });
  });
  // lanes out 27.7 / 27.95
  for (const L of LANES) {
    const kv = eio(seg(t, L.t, L.t + 2.2)), fade = 1 - ss(seg(t, 31.2, 32.4)) * .5;
    for (const r of [L.glow, L.core]) rv(r, { revB: kv * r.L, inten: (t >= L.t ? 1 : 0) * fade, head: kv * r.L, headAmt: r === L.core ? 1.5 * (1 - ss(seg(kv, .85, 1))) : 0, soft: 24, flowPh: t * 40 });
  }
  // depth of field only where it earns its cost: the low shots
  const low = t < 3.6 || (t > 25.4 && t < 30.2);
  post.dof.maxCoc = low ? 7 : 0; post.dof.focus = d; post.dof.aper = d * (t < 3.6 ? lerp(11, 2, ss(seg(t, 0, 3.6))) : 6);
  post.bloom.strength = .55 * (t > 25.4 && t < 28 ? lerp(.7, 1, ss(seg(d, 150, 300))) : 1);
  VU.fade.value = ss(seg(t, 0, .8)) * (1 - ss(seg(t, FULL - .9, FULL)));
  post.composer.render();
  // overlay
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht);
  { const a = ss(seg(t, 1.0, 1.8)) * (1 - ss(seg(t, 4.2, 5.2))) * .5; if (a > 0) { const gr = g.createLinearGradient(0, 0, 0, Ht * .55); gr.addColorStop(0, `rgba(5,8,12,${a})`); gr.addColorStop(1, 'rgba(5,8,12,0)'); g.fillStyle = gr; g.fillRect(0, 0, Wd, Ht * .55); } }
  seaNames(t, d); hubLabel(t, d); pillarLabels(t, d); laneLabels(t);
  // closing line, in the sky over the held shot
  const fin = ss(seg(t, 31.6, 32.6)) * (1 - ss(seg(t, FULL - .9, FULL)));
  if (fin > 0) txt('A TYPICAL HEADPHONE, NOT ONE BRAND', 64 * U, 96 * U, { size: 30, w: 600, sp: 7, col: C.light, a: fin });
  if (fin > 0) txt('FIGURES ARE SHARES OF GLOBAL TOTALS · SOURCES: IEA · TRENDFORCE', 64 * U, 126 * U, { size: 17, sp: 4, col: C.sea, a: .85 * fin });
  if (!Q.has('nosubs')) subtitles(t);
  credits(t);
}

window.DUR = T1 - T0;
window.render = t => frame(t + T0);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
// cue events for the mixer (film timeline)
EVF.push({ t: 0, type: 'air' }, { t: .8, type: 'pin' }, { t: 4.4, type: 'rise' });
for (const k of ['mag', 'li', 'chip']) { const s = SITES[k]; const m = Math.ceil(s.n); for (let i = 0; i < m; i++) EVF.push({ t: s.t0 + (s.t1 - s.t0) * eioInv((i + 1) / s.n > 1 ? 1 : (i + 1) / s.n) , type: 'slab', i, pillar: k }); EVF.push({ t: s.t0 - .1, type: 'pillar', pillar: k }); }
EVF.push({ t: 22.0, type: 'ignite', i: 0 }, { t: 22.35, type: 'ignite', i: 1 }, { t: 22.7, type: 'ignite', i: 2 }, { t: 24.0, type: 'dive' }, { t: 26.2, type: 'hub' },
  { t: 27.7, type: 'lane', i: 0 }, { t: 27.95, type: 'lane', i: 1 }, { t: 30.6, type: 'pull' }, { t: 31.8, type: 'final' }, { t: 33.0, type: 'close' });
function eioInv(y) { let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (eio(m) < y) lo = m; else hi = m; } return lo; }
window.EV = EVF.map(e => ({ ...e, t: e.t - T0 })).filter(e => e.t >= 0 && e.t <= T1 - T0);
window.render(0);
window.READY = true;
</script>
